<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.title"></title>
    <meta name="description" data-i18n-attr="content:meta.description" content="" />
    <meta name="theme-color" content="#1d4ed8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ccircle cx='10' cy='21' r='3.5' fill='white'/%3E%3Ccircle cx='22' cy='21' r='3.5' fill='white'/%3E%3Cpath d='M10 21h7l4-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta property="og:title" data-i18n-attr="content:meta.title" content="" />
    <meta property="og:description" data-i18n-attr="content:meta.description" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <a
      href="#main"
      class="visually-hidden focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded focus:bg-white focus:px-4 focus:py-2 focus:shadow"
      data-i18n="a11y.skipToContent"
    ></a>

    <!-- Return from Stripe Checkout. The query parameter is the only signal the site has
         that payment succeeded, so it is read once on load and then stripped from the URL
         to keep a reload from showing a stale confirmation. -->
    <div
      id="booking-result"
      role="status"
      aria-live="polite"
      hidden
      class="px-4 py-3 text-sm sm:text-base"
      data-result="none"
    >
      <div class="mx-auto max-w-6xl">
        <p id="booking-result-text" class="leading-relaxed"></p>
      </div>
    </div>

    <!-- Offline banner. Above the header content, per spec. Hidden until needed. -->
    <div
      id="offline-banner"
      role="alert"
      hidden
      class="bg-red-700 text-white px-4 py-3 text-sm sm:text-base"
    >
      <div class="mx-auto max-w-6xl flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between">
        <p id="offline-banner-text" data-i18n="banner.offline" class="leading-relaxed"></p>
        <div class="flex gap-3 shrink-0 no-print">
          <a
            id="banner-call"
            href="#"
            class="rounded bg-white text-red-800 px-3 py-2 font-semibold hover:bg-red-50"
            data-i18n="nav.call"></a
          >
          <a
            id="banner-whatsapp"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="rounded border border-white px-3 py-2 font-semibold hover:bg-red-800"
            data-i18n="nav.whatsapp"></a
          >
        </div>
      </div>
    </div>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print">
      <div class="mx-auto max-w-6xl px-4 py-3 flex items-center gap-3 flex-wrap">
        <a href="./" class="flex items-center gap-2 mr-auto">
          <span
            class="w-9 h-9 rounded-lg bg-blue-700 text-white grid place-items-center font-bold"
            aria-hidden="true">A</span
          >
          <span class="leading-tight">
            <span class="block font-semibold" data-i18n="brand.name"></span>
            <span class="block text-xs text-slate-500" data-i18n="brand.tagline"></span>
          </span>
        </a>

        <a
          id="header-call"
          href="#"
          class="rounded-lg bg-blue-700 text-white px-3 py-2 text-sm font-semibold hover:bg-blue-800"
          data-i18n="nav.call"></a
        >
        <a
          id="header-whatsapp"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          class="hidden sm:inline-flex rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-slate-100"
          data-i18n="nav.whatsapp"></a
        >

        <div
          id="lang-toggle"
          role="group"
          class="inline-flex rounded-lg border border-slate-300 overflow-hidden"
        >
          <button type="button" data-lang="fr" data-i18n="lang.fr"></button>
          <button type="button" data-lang="en" data-i18n="lang.en"></button>
        </div>
      </div>
    </header>

    <main id="main" class="mx-auto max-w-6xl w-full px-4 py-8 flex-1">
      <div class="max-w-2xl">
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight" data-i18n="hero.title"></h1>
        <p class="mt-3 text-slate-600" data-i18n="hero.subtitle"></p>
      </div>

      <div class="mt-8 flex flex-wrap items-center gap-3">
        <div
          id="category-tabs"
          role="tablist"
          class="inline-flex rounded-lg border border-slate-300 bg-white overflow-hidden"
        ></div>

        <div class="ml-auto flex items-center gap-2">
          <label for="sort-select" class="text-sm text-slate-600" data-i18n="sort.label"></label>
          <select
            id="sort-select"
            class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
          >
            <option value="price_asc" data-i18n="sort.price_asc"></option>
            <option value="price_desc" data-i18n="sort.price_desc"></option>
          </select>
        </div>

        <button
          id="open-filters"
          type="button"
          class="lg:hidden rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold"
          data-i18n-attr="aria-label:filters.open"
        >
          <span data-i18n="filters.open"></span>
          <span
            id="filter-count-badge"
            hidden
            class="ml-1 inline-block rounded-full bg-blue-700 text-white text-xs px-2 py-0.5"
          ></span>
        </button>
      </div>

      <div class="mt-6 grid gap-6 lg:grid-cols-[280px_1fr]">
        <!-- Desktop: sticky sidebar. Mobile: slide-over drawer, same node. -->
        <aside
          id="filters-panel"
          aria-label=""
          class="hidden lg:block lg:sticky lg:top-24 lg:self-start rounded-xl border border-slate-200 bg-white p-4"
        ></aside>

        <section>
          <p id="catalog-count" class="text-sm text-slate-600 mb-3"></p>          <div
            id="catalog-grid"
            class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"
            aria-busy="true"
          ></div>
        </section>
      </div>
    </main>

    <div
      id="filters-backdrop"
      hidden
      class="fixed inset-0 bg-slate-900/40 z-40 lg:hidden no-print"
    ></div>

    <!-- Booking window. Built by js/booking.js, so the markup stays in one place. -->
    <div id="booking-root"></div>

    <footer class="bg-white border-t border-slate-200 mt-8 no-print">
      <div class="mx-auto max-w-6xl px-4 py-8 grid gap-6 sm:grid-cols-3 text-sm">
        <div>
          <p class="font-semibold" data-i18n="footer.contact"></p>
          <p class="mt-2 text-slate-600" id="footer-address"></p>
          <p class="text-slate-600">
            <a id="footer-call" href="#" class="text-blue-700 underline" data-i18n="nav.call"></a>
            <span aria-hidden="true"> · </span>
            <a
              id="footer-email"
              href="#"
              class="text-blue-700 underline"
            ></a>
          </p>
        </div>
        <div>
          <p class="font-semibold" id="footer-company"></p>
          <p class="mt-2 text-slate-600" id="footer-identity"></p>
        </div>
        <div>
          <nav class="flex flex-col gap-1">
            <a href="faq.html" class="text-blue-700 underline" data-i18n="footer.faq"></a>
            <a href="cgv.html" class="text-blue-700 underline" data-i18n="footer.terms"></a>
            <a href="confidentialite.html" class="text-blue-700 underline" data-i18n="footer.privacy"></a>
            <a href="mentions-legales.html" class="text-blue-700 underline" data-i18n="footer.legal"></a>
          </nav>
          <p class="mt-3 text-slate-500" data-i18n="footer.dataUse"></p>
        </div>
      </div>
      <div class="border-t border-slate-200">
        <p class="mx-auto max-w-6xl px-4 py-4 text-xs text-slate-500">
          <span id="footer-rights"></span>
        </p>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/dates.js"></script>
    <script src="js/content.js"></script>
    <script src="js/i18n.js"></script>
    <script src="mock-vehicles.js"></script>
    <script src="js/api.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
